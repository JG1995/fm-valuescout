[package]
name = "app"
version = "0.1.0"
description = "FM ValueScout"
authors = ["FM ValueScout"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
ui-agent = ["dep:tauri-plugin-mcp-bridge"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
rusqlite = { version = "0.40", features = ["bundled"] }
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-mcp-bridge = { version = "=0.12.0", optional = true }

[dev-dependencies]
tempfile = "3"
