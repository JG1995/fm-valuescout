name: Check

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      rust: ${{ steps.filter.outputs.rust }}
      bridge: ${{ steps.filter.outputs.bridge }}
      ci: ${{ steps.filter.outputs.ci }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            frontend:
              - 'src/**'
              - 'e2e/**'
              - 'public/**'
              - 'index.html'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'biome.json'
              - '.secretlintrc.json'
              - '.secretlintignore'
              - 'tsconfig*.json'
              - 'vite.config.ts'
              - 'playwright.config.ts'
            rust:
              - 'src-tauri/**'
              - 'src-tauri/Cargo.lock'
            bridge:
              - 'bridge/**'
            ci:
              - '.github/workflows/**'
              - '.github/actions/**'
              - 'scripts/**'

  dependabot-policy:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.repository == 'JG1995/fm-valuescout' &&
      github.event.pull_request.base.repo.full_name == 'JG1995/fm-valuescout' &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Verify Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ github.token }}

      - name: Check out trusted policy
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: main
          persist-credentials: false

      - name: Require eligible Dependabot metadata
        run: ./scripts/dev dependency-automerge-policy
        env:
          DEPENDABOT_REQUIRE_ELIGIBLE: true
          DEPENDABOT_ACTOR: ${{ github.actor }}
          DEPENDABOT_PULL_REQUEST_AUTHOR: ${{ github.event.pull_request.user.login }}
          DEPENDABOT_REPOSITORY: ${{ github.repository }}
          DEPENDABOT_BASE_REPOSITORY: ${{ github.event.pull_request.base.repo.full_name }}
          DEPENDABOT_BASE_REF: ${{ github.event.pull_request.base.ref }}
          DEPENDABOT_EXPECTED_REPOSITORY: JG1995/fm-valuescout
          DEPENDABOT_EXPECTED_BASE_REF: main
          DEPENDABOT_PACKAGE_ECOSYSTEM: ${{ steps.metadata.outputs.package-ecosystem }}
          DEPENDABOT_TARGET_BRANCH: ${{ steps.metadata.outputs.target-branch }}
          DEPENDABOT_UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
          DEPENDABOT_MAINTAINER_CHANGES: ${{ steps.metadata.outputs.maintainer-changes }}
          DEPENDABOT_UPDATED_DEPENDENCIES: ${{ steps.metadata.outputs.updated-dependencies-json }}

  frontend-tests:
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run application quality checks
        run: ./scripts/dev check-app
      - name: Run frontend tests
        run: ./scripts/dev test

  browser-smoke:
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run browser smoke tests
        run: ./scripts/dev smoke

  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Run Rust quality checks
        run: ./scripts/dev check-rust

  bridge-tests:
    needs: changes
    if: needs.changes.outputs.bridge == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "6.0.x"
      - name: Run bridge unit tests
        shell: bash
        run: ./scripts/dev bridge-test

  check:
    if: always()
    needs: [changes, frontend-tests, browser-smoke, rust, bridge-tests, dependabot-policy]
    runs-on: ubuntu-latest
    steps:
      - name: Confirm applicable product checks passed
        env:
          CHANGES: ${{ needs.changes.result }}
          FRONTEND_TESTS: ${{ needs.frontend-tests.result }}
          BROWSER_SMOKE: ${{ needs.browser-smoke.result }}
          RUST: ${{ needs.rust.result }}
          BRIDGE_TESTS: ${{ needs.bridge-tests.result }}
          DEPENDABOT_POLICY: ${{ needs.dependabot-policy.result }}
        run: |
          for result in "$CHANGES" "$FRONTEND_TESTS" "$BROWSER_SMOKE" "$RUST" "$BRIDGE_TESTS" "$DEPENDABOT_POLICY"; do
            case "$result" in
              success|skipped) ;;
              *) exit 1 ;;
            esac
          done
