version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 14
    open-pull-requests-limit: 2
    allow:
      - dependency-type: "all"
        update-types:
          - "version-update:semver-patch"
    groups:
      patch-updates:
        update-types:
          - "patch"

  - package-ecosystem: "cargo"
    directory: "/src-tauri"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 14
    open-pull-requests-limit: 2
    allow:
      - dependency-type: "all"
        update-types:
          - "version-update:semver-patch"
    groups:
      patch-updates:
        update-types:
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0

  - package-ecosystem: "nuget"
    directory: "/bridge"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
